name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag in private repository (e.g. v0.2.0)"
        required: true
      ref:
        description: "Optional private source ref override (defaults to tag)"
        required: false
        default: ""
  repository_dispatch:
    types: [run-release]

permissions:
  contents: write

env:
  CGO_ENABLED: "0"
  PRIVATE_REPO: "kittors/openEggle-private"

jobs:
  prepare:
    name: Verify & Draft Release
    if: github.repository == 'kittors/openEggle'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      src_ref: ${{ steps.meta.outputs.src_ref }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Resolve release parameters
        id: meta
        run: |
          TAG="${{ inputs.tag || github.event.client_payload.tag }}"
          SRC_REF="${{ inputs.ref || github.event.client_payload.ref }}"
          if [ -z "$TAG" ]; then
            echo "Missing required release tag (e.g. v0.2.0)" >&2
            exit 1
          fi
          if [ -z "$SRC_REF" ]; then
            SRC_REF="$TAG"
          fi
          PRE="false"
          case "$TAG" in
            *-*) PRE="true" ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "src_ref=$SRC_REF" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"

      - name: Checkout private source repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: ${{ steps.meta.outputs.src_ref }}
          ssh-key: ${{ secrets.PRIVATE_SOURCE_SSH_KEY }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate version against mygo.json
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          APP_VER="$(jq -r .version mygo.json)"
          if [ "$TAG" != "v$APP_VER" ]; then
            echo "Tag $TAG does not match mygo.json version v$APP_VER" >&2
            exit 1
          fi

      - name: Run release gate checks
        run: |
          ./scripts/check-arch.sh
          go vet ./...
          go tool mygo vet .
          go run github.com/kittors/satin-mygo/cmd/satin-check .
          go test -p 1 -count=1 ./...

      - name: Create draft GitHub Release on public distribution repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            EXTRA=""
            if [ "${{ steps.meta.outputs.prerelease }}" = "true" ]; then
              EXTRA="--prerelease"
            fi
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --target main --draft --title "openEggle $TAG" --generate-notes $EXTRA
          fi

  build:
    name: Build ${{ matrix.name }}
    if: github.repository == 'kittors/openEggle'
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            platform: "darwin/arm64,darwin/amd64"
          - name: Windows
            os: ubuntu-latest
            platform: "windows/amd64"
          - name: Linux
            os: ubuntu-latest
            platform: "linux/amd64"
    steps:
      - name: Checkout private source repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: ${{ needs.prepare.outputs.src_ref }}
          ssh-key: ${{ secrets.PRIVATE_SOURCE_SSH_KEY }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install NSIS for Windows installer
        if: matrix.name == 'Windows' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Build, sign updates, and upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform "${{ matrix.platform }}" -upload

  publish:
    name: Publish Release
    if: github.repository == 'kittors/openEggle'
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          if [ "${{ needs.prepare.outputs.prerelease }}" = "true" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi
